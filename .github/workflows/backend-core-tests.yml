name: Backend Core Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    name: Core integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://zamy_ci:zamy_ci_password@localhost:5432/zamy_test?schema=public
      JWT_SECRET: ci-test-only-jwt-secret-not-for-production
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zamy_test
          POSTGRES_USER: zamy_ci
          POSTGRES_PASSWORD: zamy_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zamy_ci -d zamy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Seed test catalog
        run: npx prisma db seed

      - name: Run core integration tests
        run: npm run test:core
