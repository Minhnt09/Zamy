<header class="border-b border-[#e4d7cc] bg-[#fcf8f4]">
  <nav class="mx-auto flex min-h-16 max-w-7xl items-center justify-between gap-3 px-4 sm:px-8" aria-label="Điều hướng chính">
    <div class="flex items-center gap-2 lg:gap-0">
      <button type="button" class="store-step lg:hidden" aria-label="Menu danh mục" aria-controls="mobile-categories"
        [attr.aria-expanded]="isMobileMenuOpen" (click)="isMobileMenuOpen = !isMobileMenuOpen">
        <span aria-hidden="true">☰</span>
      </button>
      <a routerLink="/home" aria-label="Zamy, trang chủ" (click)="isMobileMenuOpen = false">
        <img src="/assets/icon/logo.svg" alt="" class="h-auto w-14 sm:w-16" width="64" height="44">
      </a>
    </div>

    <div class="hidden items-center gap-5 lg:flex">
      @for (item of menu; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="underline" ariaCurrentWhenActive="page" class="py-3 text-sm font-medium hover:underline">{{ item.label }}</a>
      }
    </div>

    <div class="flex items-center gap-1 sm:gap-2">
      <button type="button" class="store-step border-transparent" aria-label="Tìm kiếm" (click)="isSearchOpen = true">
        <img src="/assets/icon/timkiem3.png" alt="" width="20" height="20">
      </button>
      <a routerLink="/favorites" class="store-step border-transparent" aria-label="Yêu thích" (click)="isMobileMenuOpen = false">
        <img src="/assets/icon/heart1.png" alt="" width="21" height="21">
      </a>
      <a routerLink="/cart" class="store-step relative border-transparent" [attr.aria-label]="'Giỏ hàng, ' + ((cartCount$ | async) ?? 0) + ' sản phẩm'" (click)="isMobileMenuOpen = false">
        <img src="/assets/icon/giohang.png" alt="" width="24" height="24">
        @if (cartCount$ | async; as count) {
          <span class="absolute right-0 top-0 rounded-full bg-[#754242] px-1 text-xs font-medium text-white" aria-hidden="true">{{ count }}</span>
        }
      </a>
      @if (currentUser) {
        <button type="button" class="store-step border-transparent text-xs font-semibold" (click)="logout()">Thoát</button>
      } @else {
        <button type="button" class="store-step border-transparent" aria-label="Đăng nhập" (click)="showLogin = true">
          <img src="/assets/icon/user1.png" alt="" width="22" height="22">
        </button>
      }
    </div>
  </nav>
  <div id="mobile-categories" [hidden]="!isMobileMenuOpen" class="border-t px-4 pb-3 lg:hidden" (keydown.escape)="isMobileMenuOpen = false">
    @if (isMobileMenuOpen) {
      @for (item of menu; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="underline" ariaCurrentWhenActive="page" class="block py-3 text-sm font-medium" (click)="isMobileMenuOpen = false">{{ item.label }}</a>
      }
    }
  </div>
</header>

@if (showLogin) {
  <app-login-popup [notice]="loginNotice" (closePopup)="closeLogin()"></app-login-popup>
}
@if (isSearchOpen) {
  <app-search-popup (closeEvent)="isSearchOpen = false"></app-search-popup>
}
