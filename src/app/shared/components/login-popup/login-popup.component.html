<!-- OVERLAY -->
<div
  class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40"
  (click)="close()">
</div>

<!-- POPUP -->
<div class="fixed inset-y-0 right-0 w-full max-w-md bg-white rounded-l-3xl p-8 z-50 overflow-y-auto">
  <div (click)="$event.stopPropagation()">
    <button
      type="button"
      class="absolute top-4 right-4 text-2xl"
      (click)="close()">
      x
    </button>

    <h2 class="text-center text-[#936B6B] text-2xl font-semibold mb-6">
      {{ isLoginMode ? 'Đăng nhập' : 'Tạo tài khoản' }}
    </h2>

    <div class="grid grid-cols-2 gap-2 bg-[#F7EBE4] rounded-xl p-1 mb-6">
      <button
        type="button"
        class="py-2 rounded-lg font-medium text-[#936B6B]"
        [class.bg-white]="isLoginMode"
        (click)="switchMode('login')"
      >
        Đăng nhập
      </button>

      <button
        type="button"
        class="py-2 rounded-lg font-medium text-[#936B6B]"
        [class.bg-white]="!isLoginMode"
        (click)="switchMode('register')"
      >
        Đăng ký
      </button>
    </div>

    <form class="space-y-4" (ngSubmit)="submit()">
      <input
        *ngIf="!isLoginMode"
        type="text"
        name="name"
        placeholder="Họ tên"
        class="w-full bg-[#F7EBE4] px-5 py-4 rounded-xl placeholder:text-gray-600 outline-none"
        [(ngModel)]="registerForm.name"
      />

      <input
        *ngIf="isLoginMode"
        type="email"
        name="loginEmail"
        placeholder="Email"
        class="w-full bg-[#F7EBE4] px-5 py-4 rounded-xl placeholder:text-gray-600 outline-none"
        [(ngModel)]="loginForm.email"
      />

      <input
        *ngIf="!isLoginMode"
        type="email"
        name="registerEmail"
        placeholder="Email"
        class="w-full bg-[#F7EBE4] px-5 py-4 rounded-xl placeholder:text-gray-600 outline-none"
        [(ngModel)]="registerForm.email"
      />

      <div class="relative">
        <input
          *ngIf="isLoginMode"
          [type]="showPassword ? 'text' : 'password'"
          name="loginPassword"
          placeholder="Mật khẩu"
          class="w-full bg-[#F7EBE4] px-5 py-4 pr-16 rounded-xl placeholder:text-gray-600 outline-none"
          [(ngModel)]="loginForm.password"
        />

        <input
          *ngIf="!isLoginMode"
          [type]="showPassword ? 'text' : 'password'"
          name="registerPassword"
          placeholder="Mật khẩu"
          class="w-full bg-[#F7EBE4] px-5 py-4 pr-16 rounded-xl placeholder:text-gray-600 outline-none"
          [(ngModel)]="registerForm.password"
        />

        <button
          type="button"
          class="absolute right-4 top-1/2 -translate-y-1/2 text-sm text-[#936B6B]"
          (click)="togglePassword()">
          {{ showPassword ? 'Ẩn' : 'Hiện' }}
        </button>
      </div>

      <input
        *ngIf="!isLoginMode"
        [type]="showPassword ? 'text' : 'password'"
        name="confirmPassword"
        placeholder="Xác nhận mật khẩu"
        class="w-full bg-[#F7EBE4] px-5 py-4 rounded-xl placeholder:text-gray-600 outline-none"
        [(ngModel)]="registerForm.confirmPassword"
      />

      <div
        *ngIf="errorMessage"
        class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-600"
      >
        {{ errorMessage }}
      </div>

      <div
        *ngIf="successMessage"
        class="rounded-lg bg-green-50 px-4 py-3 text-sm text-green-700"
      >
        {{ successMessage }}
      </div>

      <div class="flex justify-between text-sm" *ngIf="isLoginMode">
        <button type="button" class="cursor-pointer text-[#936B6B]">
          Quên mật khẩu
        </button>
        <button
          type="button"
          class="cursor-pointer text-[#936B6B]"
          (click)="switchMode('register')"
        >
          Tạo tài khoản
        </button>
      </div>

      <button
        type="submit"
        class="w-full bg-[#F7EBE4] text-[#936B6B] font-medium text-lg py-3 rounded-xl disabled:opacity-60"
        [disabled]="loading"
      >
        {{ loading ? 'Đang xử lý...' : (isLoginMode ? 'Đăng nhập' : 'Đăng ký') }}
      </button>
    </form>
