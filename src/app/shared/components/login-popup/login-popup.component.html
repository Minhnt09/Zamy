<dialog #dialog class="store-dialog" aria-labelledby="login-title" (cancel)="$event.preventDefault(); close()">
    <button
      type="button"
      class="store-step absolute right-3 top-3" aria-label="Đóng đăng nhập"
      (click)="close()">
      x
    </button>

    <h2 id="login-title" class="text-center text-[#936B6B] text-2xl font-semibold mb-6">
      {{ isLoginMode ? 'Đăng nhập' : 'Tạo tài khoản' }}
    </h2>

    <div
      *ngIf="notice"
      class="mb-5 flex gap-3 rounded-xl border border-[#D9A441] bg-[#FFF8E7] px-4 py-3 text-sm leading-5 text-[#7A5410]"
      role="status"
    >
      <span aria-hidden="true" class="text-lg leading-5">!</span>
      <p>{{ notice }}</p>
    </div>

    <div class="grid grid-cols-2 gap-2 bg-[#F7EBE4] rounded-xl p-1 mb-6">
      <button
        type="button"
        class="py-2 rounded-lg font-medium text-[#936B6B]"
        [class.bg-white]="isLoginMode"
        (click)="switchMode('login')"
      >
        Đăng nhập
      </button>

      <button
        type="button"
        class="py-2 rounded-lg font-medium text-[#936B6B]"
        [class.bg-white]="!isLoginMode"
        (click)="switchMode('register')"
      >
        Đăng ký
      </button>
    </div>

    <form class="space-y-4" (ngSubmit)="submit()">
      <input
        *ngIf="!isLoginMode"
        type="text"
        name="name"
        placeholder="Họ tên" aria-label="Họ tên"
        class="w-full bg-[#F7EBE4] px-5 py-4 rounded-xl placeholder:text-gray-600"
        [(ngModel)]="registerForm.name"
      />

      <input
        *ngIf="isLoginMode"
        type="email"
        name="loginEmail"
        placeholder="Email" aria-label="Email"
        class="w-full bg-[#F7EBE4] px-5 py-4 rounded-xl placeholder:text-gray-600"
        [(ngModel)]="loginForm.email"
      />

      <input
        *ngIf="!isLoginMode"
        type="email"
        name="registerEmail"
        placeholder="Email" aria-label="Email"
        class="w-full bg-[#F7EBE4] px-5 py-4 rounded-xl placeholder:text-gray-600"
        [(ngModel)]="registerForm.email"
      />

      <div class="relative">
        <input
          *ngIf="isLoginMode"
          [type]="showPassword ? 'text' : 'password'"
          name="loginPassword"
          placeholder="Mật khẩu" aria-label="Mật khẩu"
          class="w-full bg-[#F7EBE4] px-5 py-4 pr-16 rounded-xl placeholder:text-gray-600"
          [(ngModel)]="loginForm.password"
        />

        <input
          *ngIf="!isLoginMode"
          [type]="showPassword ? 'text' : 'password'"
          name="registerPassword"
          placeholder="Mật khẩu" aria-label="Mật khẩu"
          class="w-full bg-[#F7EBE4] px-5 py-4 pr-16 rounded-xl placeholder:text-gray-600"
          [(ngModel)]="registerForm.password"
        />

        <button
          type="button"
          class="absolute right-4 top-1/2 -translate-y-1/2 text-sm text-[#936B6B]"
          (click)="togglePassword()">
          {{ showPassword ? 'Ẩn' : 'Hiện' }}
        </button>
      </div>

      <input
        *ngIf="!isLoginMode"
        [type]="showPassword ? 'text' : 'password'"
        name="confirmPassword"
        placeholder="Xác nhận mật khẩu" aria-label="Xác nhận mật khẩu"
        class="w-full bg-[#F7EBE4] px-5 py-4 rounded-xl placeholder:text-gray-600"
        [(ngModel)]="registerForm.confirmPassword"
      />

      <div
        *ngIf="errorMessage"
        class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-600"
      >
        {{ errorMessage }}
      </div>

      <div
        *ngIf="successMessage"
        class="rounded-lg bg-green-50 px-4 py-3 text-sm text-green-700"
      >
        {{ successMessage }}
      </div>

      <div class="flex justify-between text-sm" *ngIf="isLoginMode">
        <button type="button" class="cursor-pointer text-[#936B6B]">
          Quên mật khẩu
        </button>
        <button
          type="button"
          class="cursor-pointer text-[#936B6B]"
          (click)="switchMode('register')"
        >
          Tạo tài khoản
        </button>
      </div>

      <button
        type="submit"
        class="w-full bg-[#F7EBE4] text-[#936B6B] font-medium text-lg py-3 rounded-xl disabled:opacity-60"
        [disabled]="loading"
      >
        {{ loading ? 'Đang xử lý...' : (isLoginMode ? 'Đăng nhập' : 'Đăng ký') }}
      </button>
    </form>
