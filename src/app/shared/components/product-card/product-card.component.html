<a [routerLink]="['/products', product().id]" class="group block h-full rounded-xl">
  <div class="overflow-hidden rounded-xl bg-[#eee3d9]">
    <app-product-image [src]="product().image" class="block transition-transform duration-300 group-hover:scale-[1.03]"></app-product-image>
  </div>
  <div class="px-0.5 pt-3">
    <p class="text-sm font-semibold leading-snug group-hover:underline sm:text-base">{{ product().name }}</p>
    <p class="mt-1.5 font-semibold text-[#824b4b]">{{ product().price | number }} ₫</p>
    @if (product().stock === 0) { <p class="mt-1 text-xs text-stone-600">Hết hàng</p> }
  </div>
</a>
