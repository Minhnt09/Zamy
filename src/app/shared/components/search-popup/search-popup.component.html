<dialog #dialog class="store-dialog" aria-labelledby="search-title" (cancel)="$event.preventDefault(); closeSearch()">
  <div class="mb-3 flex items-center justify-between">
    <h2 id="search-title" class="text-xl font-semibold">Tìm sản phẩm</h2>
    <button type="button" aria-label="Đóng tìm kiếm" class="store-step" (click)="closeSearch()">×</button>
  </div>
  <form (ngSubmit)="submitSearch()" class="flex gap-2">
    <input type="search" name="keyword" class="store-input min-w-0" aria-label="Tên, mã, màu hoặc kích cỡ" placeholder="Tên, mã, màu hoặc kích cỡ" [(ngModel)]="keyword" autofocus>
    <button type="submit" class="store-button" [disabled]="!keyword.trim()">Tìm</button>
  </form>
  @if (keyword.trim()) {
    <div class="mt-3" aria-live="polite">
      @if (loading) {
        <p>Đang tải sản phẩm…</p>
      } @else if (failed) {
        <p>Không thể tải sản phẩm.</p>
        <button type="button" class="store-button-outline mt-2" (click)="loadProducts()">Thử lại</button>
      } @else {
        @for (product of filteredProducts; track product.id) {
          <a [routerLink]="['/products', product.id]" (click)="closeSearch()" class="block rounded-lg p-3 hover:bg-[#fcf8f4]">
            <span class="block font-medium">{{ product.name }}</span>
            <span class="text-sm text-stone-600">{{ product.price | number }} ₫</span>
          </a>
        } @empty {
          <p>Không tìm thấy sản phẩm phù hợp.</p>
        }
      }
    </div>
  }
</dialog>
