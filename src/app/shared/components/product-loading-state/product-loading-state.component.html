<section *ngIf="loading && !hasData" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3 lg:gap-10" aria-busy="true" aria-label="Đang tải sản phẩm">
  <div *ngFor="let placeholder of [1, 2, 3]" class="animate-pulse">
    <div class="aspect-[3/4] rounded-lg bg-[#e6d6ce]"></div>
    <div class="mt-3 h-5 w-3/4 rounded bg-[#e6d6ce]"></div>
    <div class="mt-2 h-4 w-1/2 rounded bg-[#e6d6ce]"></div>
  </div>
</section>

<section *ngIf="!loading && !hasData && errorMessage" class="rounded-lg border border-[#d8bbb0] bg-white p-6 text-center" role="alert">
  <p class="text-[#8A5252]">{{ errorMessage }}</p>
  <button type="button" (click)="retryRequested.emit()" class="mt-4 rounded-md bg-[#8A5252] px-4 py-2 font-medium text-white">Thử lại</button>
</section>
