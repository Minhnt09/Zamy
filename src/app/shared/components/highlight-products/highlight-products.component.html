<section class="mx-auto max-w-7xl px-4 pb-12 pt-6 sm:px-8" aria-labelledby="featured-title">
  <div class="mb-5 flex flex-wrap items-baseline justify-between gap-3">
    <h2 id="featured-title" class="text-2xl font-semibold tracking-tight sm:text-3xl">Sản phẩm nổi bật</h2>
    <a routerLink="/sale" class="text-sm font-medium text-[#754242] underline">Xem tất cả</a>
  </div>
  <app-product-loading-state [loading]="loading" [hasData]="items.length > 0" [errorMessage]="error" emptyMessage="Hiện chưa có sản phẩm." (retryRequested)="load(true)"></app-product-loading-state>
  <div class="grid grid-cols-2 gap-x-3 gap-y-6 sm:gap-5 lg:grid-cols-4">
    @for (item of items; track item.id) { <app-product-card [product]="item"></app-product-card> }
  </div>
</section>
