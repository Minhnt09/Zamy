<div class="highlight-products bg-[#F7EBE4] px-4 sm:px-8 md:px-12 lg:px-16 pt-5 pb-6 md:py-10">

  <!-- HEADER -->
  <div class="flex justify-between items-center gap-4 mb-5 md:mb-7">
    <h2
      class="text-[#8A5252]
             text-[20px] sm:text-[25px] md:text-[31px] lg:text-[34px]
             font-semibold">
      SẢN PHẨM NỔI BẬT
    </h2>

    <!-- ARROWS (Desktop only) -->
    <div class="hidden md:flex items-center gap-2">
      <button
        type="button"
        (click)="scrollLeft()"
        aria-label="Sản phẩm trước"
        class="flex h-10 w-10 items-center justify-center rounded-full border border-[#e2cbc2] bg-white text-2xl leading-none text-[#8A5252] shadow-sm transition hover:bg-[#8A5252] hover:text-white focus:outline-none focus:ring-2 focus:ring-[#8A5252] focus:ring-offset-2">
        <span aria-hidden="true">‹</span>
      </button>

      <button
        type="button"
        (click)="scrollRight()"
        aria-label="Sản phẩm tiếp theo"
        class="flex h-10 w-10 items-center justify-center rounded-full border border-[#e2cbc2] bg-white text-2xl leading-none text-[#8A5252] shadow-sm transition hover:bg-[#8A5252] hover:text-white focus:outline-none focus:ring-2 focus:ring-[#8A5252] focus:ring-offset-2">
        <span aria-hidden="true">›</span>
      </button>
    </div>
  </div>

  <!-- CAROUSEL -->
  <div *ngIf="loading" aria-label="Đang tải sản phẩm">
    <p class="mb-4 text-sm text-[#8A5252]">Đang tải sản phẩm…</p>
    <div class="flex gap-3.5 md:gap-6 overflow-hidden">
    <div *ngFor="let placeholder of [1, 2, 3, 4]" class="min-w-[60%] sm:min-w-[48%] md:min-w-[31%] lg:min-w-[23.5%] xl:min-w-[19%] animate-pulse">
      <div class="aspect-[5/6] md:aspect-[3/4] rounded-lg bg-[#e6d6ce]"></div>
      <div class="mt-3 h-5 w-3/4 rounded bg-[#e6d6ce]"></div>
      <div class="mt-2 h-4 w-1/2 rounded bg-[#e6d6ce]"></div>
    </div>
    </div>
  </div>
  <section *ngIf="!loading && errorMessage && product.length === 0" class="rounded-lg border border-[#d8bbb0] bg-white p-6 text-center" role="alert">
    <p class="text-[#8A5252]">{{ errorMessage }}</p>
    <button type="button" (click)="retry()" class="mt-4 rounded-md bg-[#8A5252] px-4 py-2 font-medium text-white">Thử lại</button>
  </section>
  <div
    #carousel
    *ngIf="!loading && product.length"
    class="
      featured-carousel flex gap-3.5 pr-4 md:pr-0 md:gap-6
      overflow-x-auto scroll-smooth pb-2
      snap-x snap-mandatory
    "
  >

    <div
      *ngFor="let product of product"
      class="
        min-w-[60%] max-w-[60%]
        sm:min-w-[48%] sm:max-w-[48%]
        md:min-w-[31%] md:max-w-[31%]
        lg:min-w-[23.5%] lg:max-w-[23.5%]
        xl:min-w-[19%] xl:max-w-[19%]
        snap-start
      "
    >

      <!-- IMAGE -->
      <img
        [routerLink]="['/products', product.id]"
        [src]="product.image"
        class="
          w-full
          aspect-[5/6] md:aspect-[3/4]
          object-cover
          rounded-md
          cursor-pointer
          hover:scale-105 transition duration-300
        "
        alt=""
      >

      <!-- NAME -->
      <p
        [routerLink]="['/products', product.id]"
        class="
          text-[14px] sm:text-[15px] md:text-[16px] lg:text-[17px]
          font-medium md:font-semibold leading-snug
          mt-2 h-11 overflow-hidden line-clamp-2
          cursor-pointer
        "
      >
        {{ product.name }}
      </p>

      <!-- PRICE -->
      <p
        class="text-[14px] md:text-[16px] lg:text-[17px]
               text-red-600 font-bold leading-snug mt-1"
      >
        {{ product.price | number }} VNĐ
      </p>

      <!-- RATING + SOLD -->
      <div class="flex items-center justify-start gap-3 mt-1.5 text-[11px] md:text-[13px] leading-snug">
        <div class="text-yellow-400">★★★★☆</div>
        <span class="whitespace-nowrap font-medium text-gray-600">
          ( {{ product.stock }} đã bán )
        </span>
      </div>

    </div>

  </div>
</div>
