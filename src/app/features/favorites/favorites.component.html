<main class="store-page">
  <h1 class="store-title">Sản phẩm yêu thích</h1>
  @if (favorites$ | async; as favorites) {
    @if (favorites.length) {
      <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
        @for (product of favorites; track product.id) {
          <article class="flex flex-col gap-3">
            <app-product-card [product]="product"></app-product-card>
            <button type="button" class="store-button-outline self-start" (click)="removeFavorite(product.id)" [attr.aria-label]="'Bỏ lưu ' + product.name">Bỏ lưu</button>
          </article>
        }
      </div>
    } @else {
      <div class="store-panel">
        <p class="mb-4">Bạn chưa lưu sản phẩm nào.</p>
        <a routerLink="/sale" class="store-button">Khám phá sản phẩm</a>
      </div>
    }
  }
</main>
