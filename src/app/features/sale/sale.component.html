<app-navbar></app-navbar>

<div
  class="bg-[#F7EBE4] min-h-screen font-[Poppins]
         px-4 sm:px-8 lg:px-16
         py-6 sm:py-8 lg:py-10"
>
  <h2
    class="text-[#8A5252]
           text-[26px] sm:text-[30px] lg:text-[34px]
           font-semibold text-center mb-6 lg:mb-10"
  >
    SALE
    <div class="mx-auto h-[2px] w-14 md:w-20 bg-[#8A5252]/60"></div>
  </h2>

  <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 lg:gap-10">

    <!-- FILTER SIDEBAR -->
    <div class="p-4 sm:p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold text-[#8A5252] text-[22px] lg:text-[26px]">
          Xem theo
        </h2>

        <button
          class="text-sm px-3 py-1 bg-white rounded-md border text-[#8A5252]"
          (click)="resetFilters()"
        >
          Reset
        </button>
      </div>

      <!-- PRICE -->
      <div class="mt-2">
        <h3 class="text-[22px] lg:text-[26px] font-semibold text-[#8A5252]">
          Giá
        </h3>

        <input
          type="range"
          class="w-full accent-[#8A5252] mt-3"
          min="0"
          [max]="maxPrice"
          [value]="selectedPrice"
          (input)="onPriceChange($event)"
        >

        <div class="flex justify-between mt-1 text-[14px] sm:text-[16px] lg:text-[18px]">
          <span>0</span>
          <span>{{ selectedPrice | number }} VNĐ</span>
        </div>
      </div>

      <div class="mt-7 space-y-4">
        <!-- COLOR -->
        <div>
          <button
            class="w-full flex items-center justify-between
                   text-[18px] lg:text-[20px]
                   font-medium text-[#8A5252]
                   py-2.5 lg:py-3 px-4
                   bg-white rounded-lg shadow-sm hover:bg-gray-100"
            (click)="togglePanel('color')"
          >
            <span>Màu sắc</span>
            <span class="text-xl">{{ showColor ? '−' : '+' }}</span>
          </button>

          <div
            *ngIf="showColor"
            class="mt-3 ml-3 space-y-2 text-[16px] lg:text-[18px]"
          >
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="accent-[#8A5252] w-4 h-4" (change)="toggleColor('Trắng', $event)">
              <span>Trắng</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="accent-[#8A5252] w-4 h-4" (change)="toggleColor('Đen', $event)">
              <span>Đen</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="accent-[#8A5252] w-4 h-4" (change)="toggleColor('Đỏ', $event)">
              <span>Đỏ</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="accent-[#8A5252] w-4 h-4" (change)="toggleColor('Xanh dương', $event)">
              <span>Xanh dương</span>
            </label>
          </div>
        </div>

        <!-- SIZE -->
        <div>
          <button
            class="w-full flex items-center justify-between
                   text-[18px] lg:text-[20px]
                   font-medium text-[#8A5252]
                   py-2.5 lg:py-3 px-4
                   bg-white rounded-lg shadow-sm hover:bg-gray-100"
            (click)="togglePanel('size')"
          >
            <span>Kích thước</span>
            <span class="text-xl">{{ showSize ? '−' : '+' }}</span>
          </button>

          <div
            *ngIf="showSize"
            class="mt-3 ml-3 flex flex-wrap gap-2 text-[14px] lg:text-[16px]"
          >
            <button
              type="button"
              class="px-3 py-1 border rounded-lg"
              [class.bg-[#8A5252]]="isSizeSelected('S')"
              [class.text-white]="isSizeSelected('S')"
              [class.bg-white]="!isSizeSelected('S')"
              (click)="toggleSize('S')"
            >
              S
            </button>

            <button
              type="button"
              class="px-3 py-1 border rounded-lg"
              [class.bg-[#8A5252]]="isSizeSelected('M')"
              [class.text-white]="isSizeSelected('M')"
              [class.bg-white]="!isSizeSelected('M')"
              (click)="toggleSize('M')"
            >
              M
            </button>

            <button
              type="button"
              class="px-3 py-1 border rounded-lg"
              [class.bg-[#8A5252]]="isSizeSelected('L')"
              [class.text-white]="isSizeSelected('L')"
              [class.bg-white]="!isSizeSelected('L')"
              (click)="toggleSize('L')"
            >
              L
            </button>

            <button
              type="button"
              class="px-3 py-1 border rounded-lg"
              [class.bg-[#8A5252]]="isSizeSelected('XL')"
              [class.text-white]="isSizeSelected('XL')"
              [class.bg-white]="!isSizeSelected('XL')"
              (click)="toggleSize('XL')"
            >
              XL
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- PRODUCT LIST -->
    <div class="lg:col-span-3">
      <div class="flex justify-end mb-4 lg:mb-6">
        <select
          class="px-3 py-2 border rounded-md text-sm lg:text-base"
          (change)="onSortChange($event)"
        >
          <option value="newest">Mới nhất</option>
          <option value="priceAsc">Giá tăng dần</option>
          <option value="priceDesc">Giá giảm dần</option>
        </select>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-10">
        <div
          class="p-2 transition hover:scale-[1.02] lg:hover:scale-105"
          *ngFor="let product of pagedProducts"
        >
          <div class="relative">
            <span class="absolute left-2 top-2 bg-red-500 text-white text-xs px-2 py-1 rounded">
              SALE
            </span>

            <img
              [routerLink]="['/products', product.id]"
              [src]="product.image"
              class="w-full object-cover cursor-pointer"
              alt=""
            />
          </div>

          <h4
            [routerLink]="['/products', product.id]"
            class="text-center mt-3 font-semibold text-[16px] lg:text-[18px] cursor-pointer"
          >
            {{ product.name }}
          </h4>

          <div class="text-center">
            <span class="text-red-600 font-bold text-base lg:text-lg">
              {{ product.price | number }} VNĐ
            </span>

            <div class="text-sm text-gray-500 mt-1">
              Màu: {{ product.color }} | Size: {{ product.size }}
            </div>

            <div class="text-sm text-gray-500">
              ({{ product.stock }} sản phẩm còn lại)
            </div>
          </div>
        </div>
      </div>

      <div
        *ngIf="filteredProducts.length === 0"
        class="text-center text-[#8A5252] text-lg mt-10"
      >
        Không tìm thấy sản phẩm phù hợp
      </div>

      <app-pagination
        [totalItems]="filteredProducts.length"
        [currentPage]="currentPage"
        [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOptions"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)"
      ></app-pagination>
    </div>
  </div>
</div>

<app-highlight-products></app-highlight-products>
<app-footer></app-footer>
