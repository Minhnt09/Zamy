<main>
  <section class="mx-auto grid max-w-7xl items-center gap-6 px-4 pb-7 pt-6 sm:px-8 md:grid-cols-[0.8fr_1.2fr] md:gap-10 md:py-10">
    <div class="order-2 md:order-1">
      <h1 class="max-w-[14ch] text-4xl font-semibold leading-tight tracking-tight sm:text-5xl">Bộ sưu tập Zamy</h1>
      <a routerLink="/sale" class="store-button mt-5">Khám phá sản phẩm</a>
    </div>
    <picture class="order-1 overflow-hidden rounded-2xl bg-[#ede0d6] md:order-2">
      <source type="image/webp" srcset="/assets/optimized/hero-720.webp 720w, /assets/optimized/hero-1440.webp 1440w" sizes="(min-width: 768px) 56vw, 95vw">
      <img src="/assets/img/banner1.png" alt="Bộ sưu tập thời trang Zamy" width="1440" height="630" fetchpriority="high" class="aspect-[16/7] w-full object-cover">
    </picture>
  </section>
  <nav aria-label="Danh mục sản phẩm" class="mx-auto mb-5 grid max-w-7xl grid-cols-2 gap-3 px-4 sm:grid-cols-4 sm:px-8">
    @for (category of categories; track category.path) {
      <a [routerLink]="category.path" class="store-button-outline bg-white">{{ category.name }}</a>
    }
  </nav>
  <app-highlight-products></app-highlight-products>
</main>
